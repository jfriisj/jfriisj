name: Portfolio validation
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/portfolio-ci.yml'
  push:
    paths:
      - 'website/**'
      - '.github/workflows/portfolio-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Astro dependencies
        run: npm install --prefix website --no-audit --no-fund
      - name: Validate content and build static site
        run: npm run --prefix website build
      - name: Test generated public pages
        run: python3 -m unittest discover -s website/tests -v
      - name: Validate Compose
        run: docker compose -f website/compose.yaml config -q
      - name: Build Docker image without deploying
        run: docker compose -f website/compose.yaml build
