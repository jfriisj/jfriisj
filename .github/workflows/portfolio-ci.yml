name: Portfolio validation
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/portfolio-ci.yml'
  push:
    paths:
      - 'website/**'
      - '.github/workflows/portfolio-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test page structure
        run: python3 -m unittest discover -s website/tests -v
      - name: Validate Compose
        run: docker compose -f website/compose.yaml config -q
      - name: Build image without publishing
        run: docker compose -f website/compose.yaml build
