name: friis-jakobsen-portfolio
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: friis-jakobsen-portfolio:1.0.1
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    # Intentionally no published host ports: cloudflared and this service
    # communicate over the pre-existing bridge network on VM 1214.
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - friis-jakobsen-portfolio
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
networks:
  edge:
    external: true
    name: development-proxy
